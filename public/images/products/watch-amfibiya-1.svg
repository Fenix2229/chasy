<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="steel2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="50%" style="stop-color:#b0b0b0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
    <linearGradient id="dial2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a4d5c"/>
      <stop offset="100%" style="stop-color:#063947"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#e55100"/>
    </linearGradient>
  </defs>
  <!-- Ремешок верх -->
  <rect x="65" y="0" width="70" height="55" rx="8" fill="url(#steel2)"/>
  <rect x="72" y="8" width="56" height="42" rx="4" fill="#1a1a1a"/>
  <!-- Корпус Амфибия - более массивный -->
  <circle cx="100" cy="140" r="70" fill="url(#steel2)" stroke="#777" stroke-width="3"/>
  <circle cx="100" cy="140" r="60" fill="url(#dial2)"/>
  <!-- Вращающийся безель с метками -->
  <circle cx="100" cy="140" r="66" fill="none" stroke="#555" stroke-width="8"/>
  <g fill="#ff6b35" font-family="Arial" font-size="8" font-weight="bold" text-anchor="middle">
    <text x="100" y="78">▼</text>
  </g>
  <!-- Деления безеля -->
  <g stroke="#aaa" stroke-width="1">
    <line x1="100" y1="74" x2="100" y2="80"/>
    <line x1="130" y1="78" x2="128" y2="83"/>
    <line x1="155" y1="100" x2="150" y2="103"/>
  </g>
  <!-- Метки часов -->
  <g fill="#fff" font-family="Arial" font-size="9" text-anchor="middle">
    <text x="100" y="95">12</text>
    <text x="143" y="144">3</text>
    <text x="100" y="192">6</text>
    <text x="57" y="144">9</text>
  </g>
  <!-- Минутные точки -->
  <g fill="#ff6b35">
    <circle cx="100" cy="85" r="2"/>
    <circle cx="148" cy="140" r="2"/>
    <circle cx="100" cy="195" r="2"/>
    <circle cx="52" cy="140" r="2"/>
  </g>
  <!-- Стрелки -->
  <polygon points="100,90 97,140 100,145 103,140" fill="#fff"/>
  <polygon points="135,140 100,137 100,143" fill="#fff"/>
  <line x1="100" y1="140" x2="120" y2="165" stroke="#ff6b35" stroke-width="1.5"/>
  <circle cx="100" cy="140" r="5" fill="#ff6b35"/>
  <!-- Текст -->
  <text x="100" y="120" fill="#fff" font-family="Arial" font-size="6" text-anchor="middle">ВОСТОК</text>
  <text x="100" y="165" fill="#ff6b35" font-family="Arial" font-size="7" font-weight="bold" text-anchor="middle">АМФИБИЯ</text>
  <text x="100" y="175" fill="#aaa" font-family="Arial" font-size="5" text-anchor="middle">200M</text>
  <!-- Заводная головка с защитой -->
  <rect x="165" y="128" width="20" height="24" rx="4" fill="url(#steel2)" stroke="#666" stroke-width="2"/>
  <rect x="168" y="134" width="8" height="12" rx="2" fill="#555"/>
  <!-- Ремешок низ -->
  <rect x="65" y="225" width="70" height="55" rx="8" fill="url(#steel2)"/>
  <rect x="72" y="230" width="56" height="42" rx="4" fill="#1a1a1a"/>
</svg>