<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="steel5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0"/>
      <stop offset="50%" style="stop-color:#d0d0d0"/>
      <stop offset="100%" style="stop-color:#a8a8a8"/>
    </linearGradient>
    <linearGradient id="black5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>
  <!-- Ремешок верх -->
  <rect x="68" y="0" width="64" height="52" rx="6" fill="url(#steel5)"/>
  <rect x="74" y="6" width="52" height="40" rx="3" fill="#222"/>
  <!-- Корпус классический -->
  <circle cx="100" cy="140" r="62" fill="url(#steel5)" stroke="#999" stroke-width="2"/>
  <circle cx="100" cy="140" r="55" fill="url(#black5)"/>
  <!-- Белые индексы -->
  <g fill="#fff">
    <rect x="98" y="90" width="4" height="12" rx="1"/>
    <rect x="98" y="178" width="4" height="12" rx="1"/>
    <rect x="145" y="138" width="12" height="4" rx="1"/>
    <rect x="43" y="138" width="12" height="4" rx="1"/>
  </g>
  <!-- Минутные точки -->
  <g fill="#888">
    <circle cx="120" cy="95" r="1.5"/>
    <circle cx="138" cy="113" r="1.5"/>
    <circle cx="148" cy="120" r="1.5"/>
    <circle cx="148" cy="160" r="1.5"/>
    <circle cx="138" cy="167" r="1.5"/>
    <circle cx="120" cy="185" r="1.5"/>
    <circle cx="80" cy="185" r="1.5"/>
    <circle cx="62" cy="167" r="1.5"/>
    <circle cx="52" cy="160" r="1.5"/>
    <circle cx="52" cy="120" r="1.5"/>
    <circle cx="62" cy="113" r="1.5"/>
    <circle cx="80" cy="95" r="1.5"/>
  </g>
  <!-- Окно даты -->
  <rect x="128" y="135" width="18" height="12" rx="2" fill="#fff"/>
  <text x="137" y="144" fill="#222" font-family="Arial" font-size="8" font-weight="bold" text-anchor="middle">14</text>
  <!-- Стрелки -->
  <polygon points="100,92 97,138 100,145 103,138" fill="#fff"/>
  <polygon points="138,140 100,137 100,143" fill="#fff"/>
  <line x1="100" y1="140" x2="118" y2="162" stroke="#e74c3c" stroke-width="1.5"/>
  <circle cx="100" cy="140" r="4" fill="#fff"/>
  <circle cx="100" cy="140" r="2" fill="#e74c3c"/>
  <!-- Текст -->
  <text x="100" y="118" fill="#fff" font-family="Arial" font-size="6" text-anchor="middle">ВОСТОК</text>
  <text x="100" y="170" fill="#888" font-family="Arial" font-size="5" text-anchor="middle">AUTOMATIC</text>
  <!-- Заводная головка -->
  <rect x="158" y="132" width="14" height="16" rx="3" fill="url(#steel5)" stroke="#888"/>
  <!-- Ремешок низ -->
  <rect x="68" y="228" width="64" height="52" rx="6" fill="url(#steel5)"/>
  <rect x="74" y="234" width="52" height="40" rx="3" fill="#222"/>
</svg>