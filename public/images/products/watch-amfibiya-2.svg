<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="steel7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e5e5"/>
      <stop offset="50%" style="stop-color:#b8b8b8"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
    <linearGradient id="blue7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b6"/>
      <stop offset="100%" style="stop-color:#003049"/>
    </linearGradient>
  </defs>
  <!-- Браслет верх -->
  <g fill="url(#steel7)">
    <rect x="65" y="0" width="70" height="15" rx="2"/>
    <rect x="68" y="18" width="64" height="12" rx="2"/>
    <rect x="71" y="33" width="58" height="12" rx="2"/>
    <rect x="74" y="48" width="52" height="12" rx="2"/>
  </g>
  <!-- Корпус с безелем -->
  <circle cx="100" cy="140" r="68" fill="#1a1a1a" stroke="#666" stroke-width="2"/>
  <circle cx="100" cy="140" r="64" fill="url(#steel7)" stroke="#999"/>
  <!-- Метки безеля -->
  <g fill="#fff" font-family="Arial" font-size="6" text-anchor="middle">
    <text x="100" y="82">0</text>
    <text x="160" y="144">15</text>
    <text x="100" y="206">30</text>
    <text x="40" y="144">45</text>
  </g>
  <!-- Циферблат -->
  <circle cx="100" cy="140" r="55" fill="url(#blue7)"/>
  <!-- Метки часов -->
  <g fill="#fff">
    <rect x="98" y="90" width="4" height="10" rx="1"/>
    <rect x="145" y="138" width="10" height="4" rx="1"/>
    <rect x="98" y="180" width="4" height="10" rx="1"/>
    <rect x="45" y="138" width="10" height="4" rx="1"/>
  </g>
  <!-- Подводник -->
  <path d="M85,160 C90,170 110,170 115,160 L110,175 C105,180 95,180 90,175 Z" fill="#fff" opacity="0.8"/>
  <!-- Стрелки -->
  <polygon points="100,95 96,130 100,137 104,130" fill="#fff" stroke="#000" stroke-width="0.5"/>
  <polygon points="100,140 95,140 55,138 55,142 95,142" fill="#fff" stroke="#000" stroke-width="0.5"/>
  <line x1="100" y1="140" x2="120" y2="165" stroke="#00ff00" stroke-width="2"/>
  <circle cx="100" cy="140" r="4" fill="#333"/>
  <!-- Текст -->
  <text x="100" y="120" fill="#fff" font-family="Arial" font-size="5" text-anchor="middle">ВОСТОК</text>
  <text x="100" y="150" fill="#00bfff" font-family="Arial" font-size="7" text-anchor="middle">АМФИБИЯ</text>
  <text x="100" y="195" fill="#00ff00" font-family="Arial" font-size="5" text-anchor="middle">200M</text>
  <!-- Заводная головка -->
  <rect x="165" y="130" width="18" height="20" rx="4" fill="url(#steel7)"/>
  <line x1="168" y1="135" x2="168" y2="145" stroke="#666" stroke-width="1"/>
  <line x1="172" y1="135" x2="172" y2="145" stroke="#666" stroke-width="1"/>
  <line x1="176" y1="135" x2="176" y2="145" stroke="#666" stroke-width="1"/>
  <!-- Браслет низ -->
  <g fill="url(#steel7)">
    <rect x="74" y="220" width="52" height="12" rx="2"/>
    <rect x="71" y="235" width="58" height="12" rx="2"/>
    <rect x="68" y="250" width="64" height="12" rx="2"/>
