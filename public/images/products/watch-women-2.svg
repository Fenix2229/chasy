<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="silver10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f8f8"/>
      <stop offset="50%" style="stop-color:#d5d5d5"/>
      <stop offset="100%" style="stop-color:#b0b0b0"/>
    </linearGradient>
    <linearGradient id="pearl10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9f3"/>
      <stop offset="50%" style="stop-color:#f5e6d3"/>
      <stop offset="100%" style="stop-color:#ece0d1"/>
    </linearGradient>
  </defs>
  <!-- Тонкий браслет верх -->
  <g fill="url(#silver10)">
    <rect x="85" y="0" width="30" height="12" rx="2"/>
    <rect x="87" y="14" width="26" height="10" rx="2"/>
    <rect x="89" y="26" width="22" height="10" rx="2"/>
    <rect x="91" y="38" width="18" height="12" rx="2"/>
  </g>
  <!-- Корпус маленький овальный -->
  <ellipse cx="100" cy="140" rx="42" ry="50" fill="url(#silver10)" stroke="#ccc" stroke-width="2"/>
  <!-- Декор - камни вокруг -->
  <g fill="#e0e0e0">
    <circle cx="100" cy="92" r="3" stroke="#fff" stroke-width="0.5"/>
    <circle cx="139" cy="140" r="3" stroke="#fff" stroke-width="0.5"/>
    <circle cx="100" cy="188" r="3" stroke="#fff" stroke-width="0.5"/>
    <circle cx="61" cy="140" r="3" stroke="#fff" stroke-width="0.5"/>
    <circle cx="118" cy="100" r="2"/>
    <circle cx="130" cy="118" r="2"/>
    <circle cx="130" cy="162" r="2"/>
    <circle cx="118" cy="180" r="2"/>
    <circle cx="82" cy="180" r="2"/>
    <circle cx="70" cy="162" r="2"/>
    <circle cx="70" cy="118" r="2"/>
    <circle cx="82" cy="100" r="2"/>
  </g>
  <!-- Циферблат перламутр -->
  <ellipse cx="100" cy="140" rx="32" ry="38" fill="url(#pearl10)" stroke="#e0d8d0"/>
  <!-- Минимальные метки -->
  <g stroke="#c4a484" stroke-width="1.5">
    <line x1="100" y1="107" x2="100" y2="112"/>
    <line x1="127" y1="140" x2="122" y2="140"/>
    <line x1="100" y1="173" x2="100" y2="168"/>
    <line x1="73" y1="140" x2="78" y2="140"/>
  </g>
  <!-- Стрелки тонкие -->
  <polygon points="100,112 99,135 100,140 101,135" fill="#8b7355"/>
  <polygon points="120,140 100,139 100,141" fill="#8b7355"/>
  <circle cx="100" cy="140" r="2" fill="#c4a484"/>
  <!-- Логотип -->
  <text x="100" y="130" fill="#a08060" font-family="serif" font-size="5" font-style="italic" text-anchor="middle">Восток</text>
  <text x="100" y="155" fill="#c4a484" font-family="Arial" font-size="3" text-anchor="middle">ЖЕНСКАЯ КОЛЛЕКЦИЯ</text>
  <!-- Заводная головка маленькая с камнем -->
  <circle cx="142" cy="140" r="5" fill="url(#silver10)" stroke="#ccc"/>
  <circle cx="142" cy="140" r="2" fill="#f0e8e0"/>
  <!-- Браслет низ -->
  <g fill="url(#silver10)">
    <rect x="91" y="230" width="18" height="12" rx="2"/>
    <rect x="89" y="244" width="22" height="10" rx="2"/>
    <rect x="87" y="256" width="26" height="10" rx="2"/>
    <rect x="85" y="268" width="30" height="12" rx="2"/>
  </g>
</svg>