<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="steel1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="50%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#a0a0a0"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <linearGradient id="dial1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0d1f30"/>
    </linearGradient>
  </defs>
  <!-- Ремешок верх -->
  <rect x="70" y="0" width="60" height="50" rx="5" fill="url(#steel1)"/>
  <rect x="75" y="5" width="50" height="40" rx="3" fill="#2c2c2c"/>
  <!-- Корпус -->
  <circle cx="100" cy="140" r="65" fill="url(#steel1)" stroke="#888" stroke-width="2"/>
  <circle cx="100" cy="140" r="58" fill="url(#dial1)"/>
  <!-- Безель -->
  <circle cx="100" cy="140" r="62" fill="none" stroke="url(#gold1)" stroke-width="4"/>
  <!-- Метки часов -->
  <g fill="#c9a227" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">
    <text x="100" y="95">12</text>
    <text x="145" y="144">3</text>
    <text x="100" y="193">6</text>
    <text x="55" y="144">9</text>
  </g>
  <!-- Деления -->
  <g stroke="#c9a227" stroke-width="2">
    <line x1="100" y1="85" x2="100" y2="92"/>
    <line x1="100" y1="188" x2="100" y2="195"/>
    <line x1="152" y1="140" x2="145" y2="140"/>
    <line x1="55" y1="140" x2="48" y2="140"/>
  </g>
  <!-- Стрелки -->
  <line x1="100" y1="140" x2="100" y2="100" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="140" x2="130" y2="140" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="140" x2="115" y2="160" stroke="#c9a227" stroke-width="1" stroke-linecap="round"/>
  <circle cx="100" cy="140" r="4" fill="#c9a227"/>
  <!-- Текст -->
  <text x="100" y="125" fill="#c9a227" font-family="Arial" font-size="7" text-anchor="middle">ВОСТОК</text>
  <text x="100" y="160" fill="#fff" font-family="Arial" font-size="6" text-anchor="middle">КОМАНДИРСКИЕ</text>
  <!-- Заводная головка -->
  <rect x="160" y="132" width="15" height="16" rx="3" fill="url(#steel1)" stroke="#888"/>
  <!-- Ремешок низ -->
  <rect x="70" y="230" width="60" height="50" rx="5" fill="url(#steel1)"/>
  <rect x="75" y="235" width="50" height="40" rx="3" fill="#2c2c2c"/>
</svg>