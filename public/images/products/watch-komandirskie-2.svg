<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="steel6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="50%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#a0a0a0"/>
    </linearGradient>
    <linearGradient id="green6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e5631"/>
      <stop offset="100%" style="stop-color:#0d2818"/>
    </linearGradient>
  </defs>
  <!-- Ремешок верх камуфляж -->
  <rect x="70" y="0" width="60" height="50" rx="5" fill="#4a5d23"/>
  <rect x="75" y="5" width="50" height="40" rx="3" fill="#3d4f1e"/>
  <circle cx="85" cy="20" r="8" fill="#5a6d33" opacity="0.5"/>
  <circle cx="105" cy="30" r="6" fill="#2d3f14" opacity="0.5"/>
  <!-- Корпус -->
  <circle cx="100" cy="140" r="65" fill="url(#steel6)" stroke="#888" stroke-width="2"/>
  <circle cx="100" cy="140" r="58" fill="url(#green6)"/>
  <!-- Звезда -->
  <polygon points="100,95 103,105 114,105 106,112 109,122 100,116 91,122 94,112 86,105 97,105" fill="#c9a227"/>
  <!-- Метки часов -->
  <g fill="#c9a227" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle">
    <text x="145" y="144">3</text>
    <text x="100" y="193">6</text>
    <text x="55" y="144">9</text>
  </g>
  <!-- Деления люминесцентные -->
  <g fill="#7fff00">
    <rect x="98" y="85" width="4" height="8" rx="1"/>
    <rect x="145" y="138" width="8" height="4" rx="1"/>
    <rect x="98" y="187" width="4" height="8" rx="1"/>
    <rect x="47" y="138" width="8" height="4" rx="1"/>
  </g>
  <!-- Стрелки люминесцентные -->
  <polygon points="100,93 96,138 100,145 104,138" fill="#7fff00" opacity="0.9"/>
  <polygon points="140,140 100,136 100,144" fill="#7fff00" opacity="0.9"/>
  <line x1="100" y1="140" x2="115" y2="165" stroke="#fff" stroke-width="1"/>
  <circle cx="100" cy="140" r="5" fill="#c9a227"/>
  <!-- Текст -->
  <text x="100" y="130" fill="#c9a227" font-family="Arial" font-size="5" text-anchor="middle">РОССИЯ</text>
  <text x="100" y="165" fill="#7fff00" font-family="Arial" font-size="6" text-anchor="middle">КОМАНДИРСКИЕ</text>
  <!-- Заводная головка -->
  <rect x="160" y="132" width="15" height="16" rx="3" fill="url(#steel6)" stroke="#888"/>
  <!-- Ремешок низ -->
  <rect x="70" y="230" width="60" height="50" rx="5" fill="#4a5d23"/>
  <rect x="75" y="235" width="50" height="40" rx="3" fill="#3d4f1e"/>
</svg>